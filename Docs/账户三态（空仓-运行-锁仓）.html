<svg width="100%" viewBox="0 55 680 470" role="img" xmlns="http://www.w3.org/2000/svg">
<title>三态迁移图与对应的下单意图</title>
<desc>空仓、运行、锁仓三态之间的六条转移路径及其 CTP 报单意图。运行态与锁仓态之间双向各画两条边，按「最新一笔仓单的建仓交易日」分为今日分支与跨日分支。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- ── 三态 ─────────────────────────────────────────────── -->
<rect x="40" y="236" width="140" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="110" y="258" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="14" font-weight="500" fill="#2C2C2A">空仓态</text>
<text x="110" y="280" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#5F5E5A">净敞口 = 0，簿为空</text>
<rect x="280" y="236" width="140" height="64" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="350" y="258" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="14" font-weight="500" fill="#042C53">运行态</text>
<text x="350" y="280" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#0C447C">净敞口 ≠ 0</text>
<rect x="500" y="236" width="140" height="64" rx="8" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
<text x="570" y="258" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="14" font-weight="500" fill="#042C53">锁仓态</text>
<text x="570" y="280" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#0C447C">净敞口 = 0，簿非空</text>

<!-- ── ① 空仓 → 运行（灰色：不涉及锁仓） ──────────────── -->
<path d="M110 236 L110 192 L300 192 L300 236" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="195" y="155" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#5F5E5A">① 空仓 + 买卖信号 → 开新仓</text>
<text x="195" y="172" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#5F5E5A">offset=OPEN</text>

<!-- ── 今日分支：② 运行 → 锁仓（灰色：同①，不涉及锁仓离场判定） ── -->
<path d="M350 236 L350 128 L610 128 L610 236" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="480" y="91" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#5F5E5A">② 今日仓 + 离场条件 → 反向开仓</text>
<text x="480" y="108" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#5F5E5A">offset=OPEN</text>

<!-- ── 今日分支：③ 锁仓 → 运行（蓝色） ────────────────── -->
<path d="M550 236 L550 192 L400 192 L400 236" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="480" y="155" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#0C447C">③ 今日锁 + 买卖信号 → 顺势开新仓</text>
<text x="480" y="172" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#0C447C">offset=OPEN，不动锁仓单</text>

<!-- ── 跨日分支：④ 锁仓 → 运行（蓝色） ────────────────── -->
<path d="M550 300 L550 322 L400 322 L400 300" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="475" y="340" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#0C447C">④ 跨日锁 + 买卖信号 → 平反向仓</text>
<text x="470" y="357" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#0C447C">offset=CLOSE（平掉最早一笔反向仓）</text>

<!-- ── 跨日分支：⑤ 运行 → 锁仓（有残留） ──────────────── -->
<path d="M350 300 L350 393 L610 393 L610 300" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="480" y="411" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#0F6E56">⑤ 跨日仓 + 离场条件 → 平仓后仍有持仓</text>
<text x="480" y="428" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#0F6E56">→ 锁仓态（offset=CLOSE）</text>

<!-- ── 跨日分支：⑥ 运行 → 空仓（平光） ────────────────── -->
<path d="M300 300 L300 393 L110 393 L110 300" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="205" y="411" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#0F6E56">⑥ 跨日仓 + 离场条件 → 平光</text>
<text x="205" y="428" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#0F6E56">→ 空仓态（offset=CLOSE）</text>

<!-- ── 附注 ───────────────────────────────────────────── -->
<text x="40" y="458" font-family="system-ui" font-size="11" fill="#5F5E5A">判据：最近一笔仓单 latest.entry_date &gt;= 今日 → 今日分支（此分支有是否要平今的判定）；否则 → 跨日分支（此分支都是平昨，不涉及平今判定）</text>
<text x="40" y="475" font-family="system-ui" font-size="11" fill="#5F5E5A">离场条件：含"止盈止损"与"关闭自动下单"两条路径</text>
<text x="40" y="492" font-family="system-ui" font-size="11" fill="#5F5E5A">当日没有回到空仓或锁仓态，状态机依然适用</text>
</svg>
