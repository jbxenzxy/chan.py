<svg viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="680" height="620" fill="#f8f9fb"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a2e">逻辑分层 vs 物理布局（trader_gateway/tg/）</text>
  <text x="340" y="50" text-anchor="middle" font-size="11.5" fill="#666">绿=有独立目录　黄=平铺单文件　红=跨层混装点</text>

  <!-- ① 信号源 -->
  <rect x="30" y="68" width="620" height="58" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.4"/>
  <text x="48" y="92" font-size="13.5" font-weight="700" fill="#1b5e20">① 信号源　✅ sources/ 目录</text>
  <text x="48" y="112" font-size="11.5" fill="#33691e">sse_source.py 184 行 · replay_source.py 88 · base.py 47</text>
  <text x="640" y="102" text-anchor="end" font-size="11" font-weight="700" fill="#2e7d32">边界清晰</text>

  <!-- ② 信号适配 -->
  <rect x="30" y="134" width="620" height="58" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.4"/>
  <text x="48" y="158" font-size="13.5" font-weight="700" fill="#7a5c00">② 信号适配　⚠ 无目录，散落 3 处</text>
  <text x="48" y="178" font-size="11.5" fill="#6d5900">engine.on_signal 首道门 + store.py(幂等键) + types.py(Signal 冻结)</text>
  <text x="640" y="168" text-anchor="end" font-size="11" fill="#8d6e00">职责只有三件事</text>

  <!-- ③ 策略层 -->
  <rect x="30" y="200" width="620" height="58" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.4"/>
  <text x="48" y="224" font-size="13.5" font-weight="700" fill="#1b5e20">③ 策略层　✅ strategy/ 目录</text>
  <text x="48" y="244" font-size="11.5" fill="#33691e">default_policy 148 · layered_exit 239 · example_trailing 93 · base 111</text>
  <text x="640" y="234" text-anchor="end" font-size="11" font-weight="700" fill="#2e7d32">可插拔接口</text>

  <!-- ④ 风控 -->
  <rect x="30" y="266" width="620" height="58" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.4"/>
  <text x="48" y="290" font-size="13.5" font-weight="700" fill="#7a5c00">④ 风控闸门　⚠ 半散落：一半有文件，一半在 engine 里</text>
  <text x="48" y="310" font-size="11.5" fill="#6d5900">risk.py 93 + sizing.py 211 独立；但资金闸门 _capital_gate 藏在 engine.py:929</text>
  <text x="640" y="300" text-anchor="end" font-size="11" font-weight="700" fill="#c62828">错位点</text>

  <!-- ⑤ 执行层 -->
  <rect x="30" y="332" width="620" height="72" rx="8" fill="#fdecec" stroke="#e53935" stroke-width="1.6"/>
  <text x="48" y="356" font-size="13.5" font-weight="700" fill="#8e0000">⑤ 执行层　🔴 engine.py 单文件 1534 行，混装 4 种职能</text>
  <text x="48" y="376" font-size="11.5" fill="#7a1f1f">执行编排(on_signal/on_bar) + 对账运维(_reconcile_*) + 卡单监控(F1)</text>
  <text x="48" y="394" font-size="11.5" fill="#7a1f1f">+ 落簿(_book_*) + 资金闸门(④层) —— position_book.py 247 行独立在外</text>
  <text x="640" y="364" text-anchor="end" font-size="11" font-weight="700" fill="#c62828">主要问题点</text>

  <!-- ⑥ Broker -->
  <rect x="30" y="412" width="620" height="58" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.4"/>
  <text x="48" y="436" font-size="13.5" font-weight="700" fill="#1b5e20">⑥ Broker 适配　✅ brokers/ 目录</text>
  <text x="48" y="456" font-size="11.5" fill="#33691e">simnow.py 1157 · dry_run.py 107 · base.py 147（live 由 App 层路由）</text>
  <text x="640" y="446" text-anchor="end" font-size="11" font-weight="700" fill="#2e7d32">同接口可替换</text>

  <!-- 横切 -->
  <rect x="30" y="478" width="620" height="58" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.4"/>
  <text x="48" y="502" font-size="13.5" font-weight="700" fill="#7a5c00">横切·基础设施　⚠ 平铺 tg/ 根，无目录</text>
  <text x="48" y="522" font-size="11.5" fill="#6d5900">config 219 · events 85 · store 176 · symbols 94 · types 304</text>
  <text x="640" y="512" text-anchor="end" font-size="11" fill="#8d6e00">各层共用</text>

  <!-- 依赖方向 -->
  <rect x="30" y="552" width="620" height="52" rx="8" fill="#eceff1" stroke="#78909c" stroke-width="1.2"/>
  <text x="48" y="574" font-size="12.5" font-weight="700" fill="#263238">依赖方向核实：engine.py 是唯一枢纽，import 全部模块；</text>
  <text x="48" y="592" font-size="12.5" fill="#37474f">没有任何模块反向 import engine —— 分层在依赖关系上是真实成立的，只是"物理上没摆出来"</text>
</svg>
