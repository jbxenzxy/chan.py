<svg viewBox="0 0 680 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>CLOSETODAY 品种的两态状态机</title>
<desc>空仓态收到信号开仓进入运行态；运行态触发离场时，今仓走 CLOSETODAY 平今、昨仓走 CLOSE 平昨，两条出口都直接回空仓态，锁仓态不可达。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g>
  <rect x="40" y="40" width="190" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="135" y="68" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">空仓态</text>
  <text x="135" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">net = 0 · 无仓单</text>
</g>
<g>
  <rect x="430" y="40" width="210" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="535" y="68" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">运行态</text>
  <text x="535" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">net ≠ 0 · 仅一笔仓单</text>
</g>

<path d="M230,62 H430" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="330" y="48" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">① 有信号 → OPEN N 手</text>
<path d="M430,98 H230" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="330" y="114" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">② 离场触发 → 平 N 手</text>
<text x="535" y="130" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#888780">运行态收到新信号 → 忽略（规则 ③）</text>

<g>
  <rect x="40" y="152" width="390" height="128" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="60" y="178" dominant-baseline="central" font-size="12" fill="#2C2C2A">② 的出口只看一件事：今仓还是昨仓（entry_date vs 今日）</text>
  <text x="60" y="204" dominant-baseline="central" font-size="12" fill="#04342C">今仓 → CLOSETODAY 平今 N 手 → 空仓态</text>
  <text x="60" y="230" dominant-baseline="central" font-size="12" fill="#042C53">昨仓（跨夜遗留）→ CLOSE 平昨 N 手 → 空仓态</text>
  <text x="60" y="256" dominant-baseline="central" font-size="12" font-weight="500" fill="#2C2C2A">两种出口都直接回空仓 ⇒ 锁仓态不存在</text>
</g>

<path d="M545,112 V190" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M539,144 L551,156" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round"/>
<path d="M551,144 L539,156" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round"/>
<g>
  <rect x="450" y="190" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="545" y="214" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#888780">锁仓态</text>
  <text x="545" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B4B2A9">不可达</text>
</g>
</svg>
