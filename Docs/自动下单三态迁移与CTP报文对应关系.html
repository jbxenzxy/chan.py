<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
<title>三态迁移图与对应的下单意图</title>
<desc>空仓、运行、锁仓三态之间的四条转移路径，以及每条路径发出的 CTP 报单意图。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g>
<rect x="40" y="140" width="140" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="110" y="162" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="14" font-weight="500" fill="#2C2C2A">空仓态</text>
<text x="110" y="184" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#5F5E5A">无仓单</text>
</g>
<g>
<rect x="280" y="140" width="140" height="64" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="350" y="162" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="14" font-weight="500" fill="#042C53">运行态</text>
<text x="350" y="184" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#0C447C">净敞口 ≠ 0</text>
</g>
<g>
<rect x="490" y="140" width="140" height="64" rx="8" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
<text x="560" y="162" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="14" font-weight="500" fill="#042C53">锁仓态</text>
<text x="560" y="184" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#0C447C">净敞口 = 0（互锁）</text>
</g>
<path d="M180 172 L280 172" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="230" y="190" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#5F5E5A">信号 → 开新仓</text>
<text x="230" y="205" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#5F5E5A">offset=OPEN</text>
<path d="M350 140 L350 60 L550 60 L550 140" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450" y="46" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#3C3489">今日单触发止盈/止损 → LOCK 反向开仓（offset=OPEN）</text>
<path d="M550 204 L550 290 L350 290 L350 204" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450" y="302" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#3C3489">昨锁 + 信号 → UNLOCK 买平（offset=CLOSE）</text>
<text x="450" y="318" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#3C3489">今锁 + 信号 → 开新仓（offset=OPEN，不动锁仓单）</text>
<path d="M310 204 L310 250 L110 250 L110 204" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="215" y="264" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#5F5E5A">非今日单触发止盈/止损 → CLOSE 平仓</text>
</svg>
