<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>补全后的三态迁移图与下单意图</title>
<desc>空仓、运行、锁仓三态的完整转移路径。相较原图，补上了"运行态经跨日仓离场（簿内残留双向持仓）落到锁仓态"这条缺失的边，并把离场触发按簿面分流成两条出口。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="180" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="110" y="200" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">空仓态</text>
<text x="110" y="220" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A">净敞口 = 0，簿为空</text>
<rect x="270" y="180" width="140" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="200" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#042C53">运行态</text>
<text x="340" y="220" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="12" fill="#0C447C">净敞口 ≠ 0</text>
<rect x="500" y="180" width="140" height="56" rx="8" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
<text x="570" y="200" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#042C53">锁仓态</text>
<text x="570" y="220" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="12" fill="#0C447C">净敞口 = 0，簿非空</text>
<path d="M180 208 L270 208" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="225" y="252" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A">信号 → 开新仓</text>
<text x="225" y="268" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A">offset=OPEN</text>
<path d="M340 180 L340 70 L570 70 L570 180" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="455" y="56" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="12" fill="#3C3489">今仓 + 离场 → 反向开仓（offset=OPEN）</text>
<path d="M570 236 L570 290 L360 290 L360 236" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="465" y="306" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="12" fill="#3C3489">今锁 + 信号 → 开新仓（offset=OPEN，不动锁仓单）</text>
<text x="465" y="322" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="12" fill="#3C3489">跨日锁 + 信号 → 买平（offset=CLOSE）</text>
<path d="M320 236 L320 350 L620 350 L620 236" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="470" y="366" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="12" fill="#712B13">跨日仓 + 离场（簿内残留双向持仓）→ 落到锁仓态</text>
<path d="M300 236 L300 398 L110 398 L110 236" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="205" y="414" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A">跨日仓 + 离场（平光）→ 空仓态</text>
</svg>
