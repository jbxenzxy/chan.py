<svg width="100%" viewBox="0 0 680 296" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>alert 模态框与 toast 轻提示的区别</title>
<desc>左侧 alert 模态框带全屏遮罩、页面点不动、不会自动消失；右侧 toast 无遮罩、5 秒自动淡出；两者都不阻塞独立子进程里的交易引擎。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="40" y="44" width="290" height="130" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="60" y="70" font-size="14" font-weight="500" fill="#791F1F">alert 模态框（severe 告警）</text>
<circle cx="55" cy="96" r="1.8" fill="#A32D2D"/>
<text x="68" y="100" font-size="12" fill="#A32D2D">出口：确定 / 点框外 / Esc</text>
<circle cx="55" cy="120" r="1.8" fill="#A32D2D"/>
<text x="68" y="124" font-size="12" fill="#A32D2D">全屏遮罩 → 页面点不动</text>
<circle cx="55" cy="144" r="1.8" fill="#A32D2D"/>
<text x="68" y="148" font-size="12" fill="#A32D2D">不会自己消失，必须有人看</text>

<rect x="350" y="44" width="290" height="130" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="370" y="70" font-size="14" font-weight="500" fill="#444441">toast 轻提示（warn / 引擎动作）</text>
<circle cx="365" cy="96" r="1.8" fill="#5F5E5A"/>
<text x="378" y="100" font-size="12" fill="#5F5E5A">出口：5 秒自动淡出 / 点一下</text>
<circle cx="365" cy="120" r="1.8" fill="#5F5E5A"/>
<text x="378" y="124" font-size="12" fill="#5F5E5A">无遮罩 → 页面照常可点</text>
<circle cx="365" cy="144" r="1.8" fill="#5F5E5A"/>
<text x="378" y="148" font-size="12" fill="#5F5E5A">自己消失，不需要确认</text>

<path d="M185 176L185 206" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="193" y="196" font-size="12" fill="#5F5E5A">不阻塞</text>
<path d="M495 176L495 206" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="503" y="196" font-size="12" fill="#5F5E5A">不阻塞</text>

<rect x="40" y="210" width="600" height="66" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="60" y="236" font-size="14" font-weight="500" fill="#27500A">交易引擎（独立操作系统子进程）</text>
<text x="60" y="258" font-size="12" fill="#3B6D11">两种弹窗都挡不住它：照常取行情 / 判信号 / 报单 / 落账</text>
</svg>
