<svg viewBox="0 0 680 480" width="100%" role="img">
  <title>TP/SL 分层组合骨架图</title>
  <desc>从入场到出场，四层 TP/SL 策略的纵向骨架，每层解决一类风险</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="32" font-size="15" font-weight="500" fill="#1f2937">TP/SL 策略四层骨架</text>
  <text x="40" y="50" font-size="12" fill="#5F5E5A">从入场到出场：每层解决一类风险，纵向叠加而非横向并列</text>

  <g>
    <rect x="270" y="68" width="140" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="92" text-anchor="middle" dominant-baseline="central" fill="#0C447C" font-size="14" font-weight="500">信号入场</text>
  </g>

  <g>
    <rect x="240" y="128" width="200" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="148" text-anchor="middle" dominant-baseline="central" fill="#0C447C" font-size="14" font-weight="500">L1 · R 倍数定基线</text>
    <text x="340" y="166" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="11">止损 = 1R · 止盈 = 2R / 3R</text>
  </g>

  <g>
    <rect x="240" y="200" width="200" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="340" y="220" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500">L2 · 波动率定宽窄</text>
    <text x="340" y="238" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="11">用 ATR 调 1R = 多大（点 / 倍数）</text>
  </g>

  <g>
    <rect x="240" y="272" width="200" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="340" y="292" text-anchor="middle" dominant-baseline="central" fill="#27500A" font-size="14" font-weight="500">L3 · 移动 / 保本锁利</text>
    <text x="340" y="310" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="11">浮盈 ≥ 1R → 推 SL 至 entry + ε</text>
  </g>

  <g>
    <rect x="240" y="344" width="200" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="340" y="364" text-anchor="middle" dominant-baseline="central" fill="#633806" font-size="14" font-weight="500">L4 · 时间 / 收盘兜底</text>
    <text x="340" y="382" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="11">持仓 ≥ N 根 或 收盘 → 强平</text>
  </g>

  <g>
    <rect x="270" y="416" width="140" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="340" y="440" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-size="14" font-weight="500">信号出场</text>
  </g>

  <line x1="340" y1="108" x2="340" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="180" x2="340" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="252" x2="340" y2="272" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="324" x2="340" y2="344" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="396" x2="340" y2="416" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="148" font-size="11" fill="#5F5E5A" font-weight="500">解决什么：</text>
  <text x="40" y="164" font-size="11" fill="#5F5E5A">· 把「亏多少」量化</text>
  <text x="40" y="178" font-size="11" fill="#5F5E5A">· 约束盈亏比</text>

  <text x="460" y="148" font-size="11" fill="#5F5E5A" font-weight="500">怎么表达：</text>
  <text x="460" y="164" font-size="11" fill="#5F5E5A">· 一切用 R 的倍数说</text>
  <text x="460" y="178" font-size="11" fill="#5F5E5A">· 不说「10 点止损」</text>

  <text x="40" y="220" font-size="11" fill="#5F5E5A" font-weight="500">解决什么：</text>
  <text x="40" y="236" font-size="11" fill="#5F5E5A">· 行情快慢自适应</text>
  <text x="40" y="250" font-size="11" fill="#5F5E5A">· 不被一档插针打掉</text>

  <text x="460" y="220" font-size="11" fill="#5F5E5A" font-weight="500">怎么表达：</text>
  <text x="460" y="236" font-size="11" fill="#5F5E5A">· 1R = k × ATR</text>
  <text x="460" y="250" font-size="11" fill="#5F5E5A">· k 通常取 1.5~2.5</text>

  <text x="40" y="292" font-size="11" fill="#5F5E5A" font-weight="500">解决什么：</text>
  <text x="40" y="308" font-size="11" fill="#5F5E5A">· 盈利回吐</text>
  <text x="40" y="322" font-size="11" fill="#5F5E5A">· 浮盈不落袋</text>

  <text x="460" y="292" font-size="11" fill="#5F5E5A" font-weight="500">怎么表达：</text>
  <text x="460" y="308" font-size="11" fill="#5F5E5A">· SL 单边往有利方向推</text>
  <text x="460" y="322" font-size="11" fill="#5F5E5A">· 永不往回退</text>

  <text x="40" y="364" font-size="11" fill="#5F5E5A" font-weight="500">解决什么：</text>
  <text x="40" y="380" font-size="11" fill="#5F5E5A">· 久盘不决</text>
  <text x="40" y="394" font-size="11" fill="#5F5E5A">· 隔夜跳空</text>

  <text x="460" y="364" font-size="11" fill="#5F5E5A" font-weight="500">怎么表达：</text>
  <text x="460" y="380" font-size="11" fill="#5F5E5A">· 时间或事件硬约束</text>
  <text x="460" y="394" font-size="11" fill="#5F5E5A">· 不等解套</text>
</svg>
