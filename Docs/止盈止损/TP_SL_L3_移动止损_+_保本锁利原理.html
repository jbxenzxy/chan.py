<svg viewBox="0 0 680 440" width="100%" role="img">
  <title>移动止损 + 保本锁利原理</title>
  <desc>浮盈触发的止损演化：阶段 1 持仓等待 → 阶段 2 保本锁利 → 阶段 3 移动追踪</desc>

  <text x="40" y="32" font-size="15" font-weight="500" fill="#1f2937">L3 · 移动 / 保本锁利</text>
  <text x="40" y="50" font-size="12" fill="#5F5E5A">止损线随浮盈演化：阶段 1 等 → 阶段 2 保本 → 阶段 3 移动追踪</text>

  <text x="40" y="86" font-size="13" font-weight="500" fill="#0C447C">价格 × 止损线演化</text>

  <line x1="60" y1="380" x2="640" y2="380" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="350" y="398" text-anchor="middle" font-size="11" fill="#5F5E5A">时间 →</text>

  <line x1="60" y1="100" x2="60" y2="380" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="40" y="240" font-size="11" fill="#5F5E5A" transform="rotate(-90, 40, 240)" text-anchor="middle">价格</text>

  <line x1="60" y1="260" x2="640" y2="260" stroke="#185FA5" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="64" y="256" font-size="10" fill="#185FA5">Entry E</text>

  <line x1="60" y1="230" x2="640" y2="230" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="2 4"/>
  <text x="64" y="226" font-size="10" fill="#5F5E5A">+1R</text>

  <line x1="60" y1="200" x2="640" y2="200" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="2 4"/>
  <text x="64" y="196" font-size="10" fill="#5F5E5A">+2R</text>

  <line x1="60" y1="170" x2="640" y2="170" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="2 4"/>
  <text x="64" y="166" font-size="10" fill="#5F5E5A">+3R</text>

  <line x1="60" y1="300" x2="640" y2="300" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="2 4"/>
  <text x="64" y="296" font-size="10" fill="#5F5E5A">−1R</text>

  <line x1="60" y1="300" x2="170" y2="300" stroke="#A32D2D" stroke-width="1.5"/>
  <text x="68" y="316" font-size="10" fill="#A32D2D">初始 SL = E − 1R（阶段 1）</text>

  <polyline points="60,260 100,250 140,235 180,230 220,220 260,200 300,180 340,170 380,160 420,175 460,190 500,210 540,230 580,250 620,260" fill="none" stroke="#185FA5" stroke-width="1.8"/>

  <circle cx="180" cy="230" r="5" fill="#3B6D11"/>
  <text x="180" y="412" text-anchor="middle" font-size="10" fill="#3B6D11">触发 ①</text>

  <circle cx="340" cy="170" r="5" fill="#3B6D11"/>
  <text x="340" y="412" text-anchor="middle" font-size="10" fill="#3B6D11">触发 ②</text>

  <circle cx="620" cy="260" r="5" fill="#791F1F"/>
  <text x="620" y="412" text-anchor="middle" font-size="10" fill="#791F1F">出场 ③</text>

  <line x1="180" y1="262" x2="340" y2="262" stroke="#3B6D11" stroke-width="1.5"/>
  <text x="190" y="254" font-size="10" fill="#3B6D11">保本 SL = E + ε（阶段 2）</text>

  <polyline points="340,190 380,200 420,210 460,220 500,230 540,240 580,250 620,260" fill="none" stroke="#3B6D11" stroke-width="1.5"/>
  <text x="400" y="148" font-size="10" fill="#3B6D11">移动 SL = peak − 1.5×ATR（阶段 3）</text>

  <line x1="340" y1="160" x2="380" y2="160" stroke="#3B6D11" stroke-width="0.5" stroke-dasharray="2 2"/>
  <line x1="340" y1="160" x2="340" y2="170" stroke="#3B6D11" stroke-width="0.5" stroke-dasharray="2 2"/>

  <text x="40" y="100" font-size="11" font-weight="500" fill="#185FA5">阶段 1：持仓等待</text>
  <text x="40" y="115" font-size="10" fill="#5F5E5A">SL 固定不动，</text>
  <text x="40" y="128" font-size="10" fill="#5F5E5A">等价格走出 1R</text>

  <text x="220" y="100" font-size="11" font-weight="500" fill="#3B6D11">阶段 2：保本锁利</text>
  <text x="220" y="115" font-size="10" fill="#5F5E5A">浮盈 ≥ 1R，</text>
  <text x="220" y="128" font-size="10" fill="#5F5E5A">SL 推至 E + ε</text>

  <text x="440" y="100" font-size="11" font-weight="500" fill="#3B6D11">阶段 3：移动追踪</text>
  <text x="440" y="115" font-size="10" fill="#5F5E5A">浮盈 ≥ 2R，</text>
  <text x="440" y="128" font-size="10" fill="#5F5E5A">SL = peak − 1.5×ATR</text>

  <line x1="40" y1="420" x2="640" y2="420" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="340" y="434" text-anchor="middle" font-size="11" fill="#5F5E5A">核心：止损不是「一次设定终身不变」，而是「随着行情往有利方向走，单边往上调/下推」，把已浮盈的利润逐步固化</text>
</svg>
