<svg viewBox="0 0 680 400" width="100%" role="img">
  <title>波动率定宽窄原理</title>
  <desc>ATR 自适应 vs 固定点距：在不同波动率下的止损宽度对比</desc>

  <text x="40" y="32" font-size="15" font-weight="500" fill="#1f2937">L2 · 波动率定宽窄</text>
  <text x="40" y="50" font-size="12" fill="#5F5E5A">1R = k × ATR(14)，让 1R 自动跟着当下行情大小伸缩，k 通常取 1.5~2.5</text>

  <text x="40" y="86" font-size="13" font-weight="500" fill="#0C447C">① 低波动：ATR = 1.5 点（行情平静）</text>

  <line x1="60" y1="100" x2="320" y2="100" stroke="#D3D1C7" stroke-width="0.5"/>
  <line x1="60" y1="240" x2="60" y2="100" stroke="#D3D1C7" stroke-width="0.5"/>

  <line x1="60" y1="220" x2="320" y2="220" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="68" y="216" font-size="10" fill="#A32D2D">固定 SL −10 点</text>

  <line x1="60" y1="232" x2="320" y2="232" stroke="#3B6D11" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="68" y="228" font-size="10" fill="#3B6D11">ATR SL = −2 × 1.5 = −3 点</text>

  <polyline points="60,180 80,184 100,178 120,182 140,180 160,184 180,180 200,182 220,180 240,184 260,180 280,182 300,184 320,180" fill="none" stroke="#185FA5" stroke-width="1.5"/>

  <circle cx="60" cy="180" r="4" fill="#185FA5"/>
  <text x="60" y="170" font-size="10" fill="#185FA5" text-anchor="middle">入场 E</text>

  <text x="160" y="278" font-size="11" fill="#5F5E5A" text-anchor="middle">问题：固定 −10 距太大，</text>
  <text x="160" y="294" font-size="11" fill="#5F5E5A" text-anchor="middle">每一笔都吃 ~7R 风险预算，</text>
  <text x="160" y="310" font-size="11" fill="#3B6D11" text-anchor="middle">ATR 自适应只花 1R 就能抓住</text>

  <line x1="340" y1="100" x2="340" y2="340" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="2 4"/>

  <text x="360" y="86" font-size="13" font-weight="500" fill="#0C447C">② 高波动：ATR = 8 点（行情剧烈）</text>

  <line x1="380" y1="100" x2="640" y2="100" stroke="#D3D1C7" stroke-width="0.5"/>
  <line x1="380" y1="240" x2="380" y2="100" stroke="#D3D1C7" stroke-width="0.5"/>

  <line x1="380" y1="220" x2="640" y2="220" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="388" y="216" font-size="10" fill="#A32D2D">固定 SL −10 点</text>

  <line x1="380" y1="180" x2="640" y2="180" stroke="#3B6D11" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="388" y="176" font-size="10" fill="#3B6D11">ATR SL = −2 × 8 = −16 点</text>

  <polyline points="380,200 400,170 420,210 440,160 460,220 480,150 500,210 520,170 540,220 560,160 580,210 600,170 620,200 640,180" fill="none" stroke="#185FA5" stroke-width="1.5"/>

  <circle cx="380" cy="200" r="4" fill="#185FA5"/>
  <text x="380" y="190" font-size="10" fill="#185FA5" text-anchor="middle">入场 E</text>

  <circle cx="420" cy="210" r="4" fill="#A32D2D"/>
  <text x="430" y="218" font-size="10" fill="#A32D2D">固定 SL 被插针打掉</text>

  <text x="510" y="278" font-size="11" fill="#5F5E5A" text-anchor="middle">问题：固定 −10 太紧，</text>
  <text x="510" y="294" font-size="11" fill="#5F5E5A" text-anchor="middle">正常波动就把单扫了，</text>
  <text x="510" y="310" font-size="11" fill="#3B6D11" text-anchor="middle">ATR 自适应留出呼吸空间</text>

  <line x1="40" y1="340" x2="640" y2="340" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="340" y="360" text-anchor="middle" font-size="11" font-weight="500" fill="#1f2937">「波动率定宽窄」= 用 ATR 给 1R 标定绝对大小</text>
  <text x="340" y="378" text-anchor="middle" font-size="11" fill="#5F5E5A">· 行情平静 → 止损自动收紧（3 点），不浪费风险预算</text>
  <text x="340" y="392" text-anchor="middle" font-size="11" fill="#5F5E5A">· 行情剧烈 → 止损自动放宽（16 点），不被正常波动扫掉</text>
</svg>
