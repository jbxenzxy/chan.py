<h1>常驻服务进程与两引擎交互图(消费方模型)· 2026-09-30 · SSOT:两引擎交互图_20260930.json</h1>
<svg width="1160" height="745" viewBox="0 0 1160 745" xmlns="http://www.w3.org/2000/svg">

  <rect class="box" x="140" y="30" width="880" height="170" rx="8"/>
  <text class="title" x="160" y="56">常驻服务进程(FrontAPI · uvicorn · 端口 18081)—— 缠论引擎的宿主 + 交易引擎的托管者,本身不是引擎</text>

  <text class="line" x="816" y="602">· SSE 连接②断、Worker 轮询停</text>
