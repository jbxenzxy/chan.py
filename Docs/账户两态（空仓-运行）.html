<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
<title>两态迁移图与对应的下单意图（CLOSETODAY 品种）</title>
<desc>空仓、运行两态之间的三条转移路径及其 CTP 报单意图。第三列 close_mode = CLOSETODAY 的品种（AU/AG/CU）：运行态有且只有一笔当日仓，平今即回空仓，锁仓态结构性不可达。今日仓走平今（CLOSETODAY），跨日仓走平昨（CLOSE）。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- ── 两态 ─────────────────────────────────────────────── -->
<rect x="60" y="210" width="140" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="232" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="14" font-weight="500" fill="#2C2C2A">空仓态</text>
<text x="130" y="254" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#5F5E5A">净敞口 = 0，簿为空</text>
<rect x="480" y="210" width="140" height="64" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="550" y="232" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="14" font-weight="500" fill="#042C53">运行态</text>
<text x="550" y="254" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#0C447C">净敞口 ≠ 0（有且只有一笔当日仓）</text>

<!-- ── ① 空仓 → 运行（灰色：开新仓，产生当日仓） ──────────── -->
<path d="M130 210 L130 150 L550 150 L550 210" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="120" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#5F5E5A">① 空仓 + 买卖信号 → 开新仓</text>
<text x="340" y="138" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#5F5E5A">offset=OPEN（产生当日仓）</text>

<!-- ── ② 运行 → 空仓（绿色实线：今日仓平今，两态主路径） ── -->
<path d="M550 274 L550 318 L130 318 L130 274" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="338" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#0F6E56">② 今日仓 + 离场条件 → 平今</text>
<text x="340" y="356" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#0F6E56">offset=CLOSETODAY → 回空仓态（两态机：平完即空仓）</text>

<!-- ── ③ 运行 → 空仓（绿色虚线：跨日仓平昨，隔夜防御路径） ── -->
<path d="M550 274 L550 398 L130 398 L130 274" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="340" y="418" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#0F6E56">③ 跨日仓(隔夜) + 离场条件 → 平昨</text>
<text x="340" y="436" text-anchor="middle" dominant-baseline="central" font-family="system-ui" font-size="12" fill="#0F6E56">offset=CLOSE → 回空仓态（需隔夜持有才出现）</text>

<!-- ── 附注 ───────────────────────────────────────────── -->
<text x="60" y="462" font-family="system-ui" font-size="11" fill="#5F5E5A">判据：latest.entry_date &gt;= 今日 → 今日分支（走平今 CLOSETODAY）；否则 → 跨日分支（平昨 CLOSE）。</text>
<text x="60" y="480" font-family="system-ui" font-size="11" fill="#5F5E5A">锁仓态结构性不可达：这类品种运行态有且只有一笔当日仓，平今即回空仓，不会生成反向仓 → 状态机退化为「空仓 ⇄ 运行」两态。</text>
</svg>
